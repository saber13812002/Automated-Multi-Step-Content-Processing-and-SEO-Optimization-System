services:
  ai-benchmarker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-benchmark:latest
    container_name: ai-benchmarker
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      APP_LOG_LEVEL: "INFO"
      DATABASE_URL: "sqlite:////data/ai_benchmarker.db"
    volumes:
      - ai_benchmarker_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ai_benchmarker_data:
