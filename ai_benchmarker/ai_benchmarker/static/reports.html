<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>گزارشات AI Benchmarker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <style>
    body { background: #f8f9fa; }
    .wer-low { background: #198754; }
    .wer-mid { background: #ffc107; color: #000; }
    .wer-high { background: #dc3545; }
    .table td { vertical-align: middle; font-size: 0.9rem; }
    .guid { font-family: monospace; font-size: 0.8rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">AI Benchmarker — گزارشات</span>
      <div>
        <a href="/admin" class="btn btn-outline-light btn-sm me-2">پنل ادمین</a>
        <a href="/api/v1/benchmarks/export.csv" class="btn btn-success btn-sm" id="csvBtn">دانلود CSV</a>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">فیلتر بر اساس GUID</label>
        <input type="text" class="form-control" id="filterGuid" placeholder="audio_guid (اختیاری)" />
      </div>
      <div class="col-md-6 d-flex align-items-end">
        <button class="btn btn-primary" onclick="refreshAll()">بروزرسانی</button>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header fw-bold">فایل‌های مرجع (AudioMasters)</div>
      <div class="card-body table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead><tr><th>GUID</th><th>فایل</th><th>تعداد</th><th>متن مرجع</th></tr></thead>
          <tbody id="audioTable"></tbody>
        </table>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header fw-bold">ترنسکریپشن‌ها</div>
      <div class="card-body table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead><tr><th>#</th><th>مدل</th><th>GUID</th><th>متن</th></tr></thead>
          <tbody id="txTable"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header fw-bold">نتایج Benchmark</div>
      <div class="card-body table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead>
            <tr>
              <th>#</th><th>مرجع</th><th>مدل</th><th>WER</th>
              <th>Bi-gram</th><th>Tri-gram</th><th>LCS</th>
            </tr>
          </thead>
          <tbody id="benchTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function werBadge(wer) {
      const pct = (wer * 100).toFixed(1) + "%";
      let cls = "wer-low";
      if (wer >= 0.3) cls = "wer-high";
      else if (wer >= 0.1) cls = "wer-mid";
      return `<span class="badge ${cls}">${pct}</span>`;
    }

    function pct(v) { return (v * 100).toFixed(1) + "%"; }

    function guidFilter() {
      return document.getElementById("filterGuid").value.trim();
    }

    function qs(guid) {
      return guid ? `?audio_guid=${encodeURIComponent(guid)}` : "";
    }

    async function refreshAll() {
      const guid = guidFilter();
      document.getElementById("csvBtn").href = "/api/v1/benchmarks/export.csv" + qs(guid);

      const audioRes = await fetch("/api/v1/audio");
      const audioData = await audioRes.json();
      document.getElementById("audioTable").innerHTML = audioData.items.map(a => `
        <tr>
          <td class="guid">${a.audio_guid.slice(0, 12)}...</td>
          <td>${a.file_name}</td>
          <td>${a.transcription_count}</td>
          <td>${a.approved_text.slice(0, 80)}...</td>
        </tr>`).join("") || "<tr><td colspan='4'>خالی</td></tr>";

      const txRes = await fetch("/api/v1/transcriptions" + qs(guid));
      const txData = await txRes.json();
      document.getElementById("txTable").innerHTML = txData.map(t => `
        <tr>
          <td>${t.id}</td>
          <td><span class="badge bg-secondary">${t.model_name}</span></td>
          <td class="guid">${t.audio_guid.slice(0, 12)}...</td>
          <td>${t.normalized_text.slice(0, 80)}...</td>
        </tr>`).join("") || "<tr><td colspan='4'>خالی</td></tr>";

      const benchRes = await fetch("/api/v1/benchmarks" + qs(guid));
      const benchData = await benchRes.json();
      document.getElementById("benchTable").innerHTML = benchData.map(b => `
        <tr>
          <td>${b.id}</td>
          <td>${b.ref_model_name || b.ref_id}</td>
          <td>${b.hyp_model_name || b.hyp_id}</td>
          <td>${werBadge(b.wer)}</td>
          <td>${pct(b.ngram_bigram)}</td>
          <td>${pct(b.ngram_trigram)}</td>
          <td>${pct(b.lcs_score)}</td>
        </tr>`).join("") || "<tr><td colspan='7'>هنوز نتیجه‌ای نیست</td></tr>";
    }

    refreshAll();
  </script>
</body>
</html>
